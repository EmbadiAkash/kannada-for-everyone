<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kannada for Everyone – learn practical Kannada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ---- Colour tokens: indigo ink, turmeric yellow, kumkum red (Karnataka flag nod) ---- */
:root{--bg:#F3F4FA;--card:#fff;--ink:#1B1F3B;--mute:#5d6385;--yel:#F2B705;--red:#C8102E;--ok:#1b8a4b;--line:#d9dcec}
@media (prefers-color-scheme:dark){:root{--bg:#12142a;--card:#1c2040;--ink:#f1f2fb;--mute:#a5abd0;--line:#32376a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Kannada",system-ui,sans-serif;line-height:1.5}
header{background:#1B1F3B;color:#fff;padding:2rem 1rem 1.5rem;border-bottom:6px solid var(--yel);position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:6px;background:var(--red)}
.wrap{max-width:860px;margin:0 auto}
header h1{margin:0;font-size:clamp(3rem,12vw,5.5rem);line-height:1.1;color:var(--yel);font-weight:800}
header p{margin:.25rem 0 0;max-width:34rem;color:#dfe2f7}
nav{display:flex;gap:.5rem;margin:1.75rem 0 1rem;flex-wrap:wrap}
nav button,.chip{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:.5rem 1rem;border-radius:999px;cursor:pointer}
nav button[aria-selected=true],.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;margin-bottom:.8rem;display:grid;grid-template-columns:1fr auto;gap:.5rem 1rem;align-items:center}
.kn{font-size:1.6rem;font-weight:600;line-height:1.3}
.tr{color:var(--red);font-weight:600}
.en{color:var(--mute)}
.acts{display:flex;gap:.4rem;flex-wrap:wrap}
.btn{font:inherit;border:0;border-radius:10px;padding:.5rem .8rem;cursor:pointer;background:var(--yel);color:#1B1F3B;font-weight:600}
.btn.alt{background:var(--ink);color:#fff}
.res{grid-column:1/-1;font-size:.95rem;min-height:1.2em}
.good{color:var(--ok)} .bad{color:var(--red)}
.notice{background:var(--card);border-left:5px solid var(--yel);padding:.7rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem;color:var(--mute)}
.q{font-size:1.3rem;font-weight:600;margin:.5rem 0 1rem}
.opt{display:block;width:100%;text-align:left;margin-bottom:.5rem;font:inherit;padding:.8rem 1rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer}
.opt.right{border-color:var(--ok)} .opt.wrong{border-color:var(--red)}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:.5rem 0 1rem}
.bar i{display:block;height:100%;background:var(--yel);width:0;transition:width .3s}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:2rem 1rem}
@media (max-width:560px){.card{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>ಕನ್ನಡ</h1>
  <p>Kannada for Everyone. Pick a real-life situation, hear the phrase, say it back, and get scored.</p>
</div></header>

<main class="wrap" style="padding:0 1rem">
  <nav role="tablist" aria-label="Sections">
    <button role="tab" id="t-learn" aria-selected="true">Learn phrases</button>
    <button role="tab" id="t-quiz" aria-selected="false">Quiz</button>
  </nav>
  <div id="notice" class="notice" hidden></div>
  <section id="learn"></section>
  <section id="quiz" hidden></section>
</main>
<footer>Built for the Kannada Digital Innovation Hackathon 2026 · Code. Create. Celebrate Kannada.</footer>

<script>
/* ============ 1. DATA: situations -> phrases [kannada, transliteration, english] ============ */
const DATA = {
  "Greetings": [
    ["ನಮಸ್ಕಾರ","Namaskara","Hello"],
    ["ಹೇಗಿದ್ದೀರಾ?","Hegiddira?","How are you?"],
    ["ನಾನು ಚೆನ್ನಾಗಿದ್ದೇನೆ","Naanu chennaagiddene","I am fine"],
    ["ಧನ್ಯವಾದಗಳು","Dhanyavaadagalu","Thank you"],
    ["ನಿಮ್ಮ ಹೆಸರೇನು?","Nimma hesarenu?","What is your name?"]
  ],
  "Travel": [
    ["ಬಸ್ ನಿಲ್ದಾಣ ಎಲ್ಲಿದೆ?","Bus nildaana ellide?","Where is the bus stand?"],
    ["ಎಡಕ್ಕೆ ತಿರುಗಿ","Edakke tirugi","Turn left"],
    ["ಬಲಕ್ಕೆ ತಿರುಗಿ","Balakke tirugi","Turn right"],
    ["ನೇರವಾಗಿ ಹೋಗಿ","Neravaagi hogi","Go straight"],
    ["ಇಲ್ಲಿ ನಿಲ್ಲಿಸಿ","Illi nillisi","Stop here"]
  ],
  "Shopping": [
    ["ಇದರ ಬೆಲೆ ಎಷ್ಟು?","Idara bele eshtu?","How much is this?"],
    ["ಸ್ವಲ್ಪ ಕಡಿಮೆ ಮಾಡಿ","Svalpa kadime maadi","Please reduce the price a little"],
    ["ನನಗೆ ಇದು ಬೇಕು","Nanage idu beku","I want this"],
    ["ಬೇಡ","Beda","No, I don't want it"],
    ["ಚಿಲ್ಲರೆ ಇದೆಯೇ?","Chillare ideya?","Do you have change?"]
  ],
  "Food": [
    ["ನೀರು ಕೊಡಿ","Neeru kodi","Please give water"],
    ["ಒಂದು ಕಾಫಿ ಕೊಡಿ","Ondu kaaphi kodi","One coffee please"],
    ["ತುಂಬಾ ರುಚಿಯಾಗಿದೆ","Tumba ruchiyaagide","It is very tasty"],
    ["ಖಾರ ಕಡಿಮೆ ಇರಲಿ","Khaara kadime irali","Less spicy please"],
    ["ಬಿಲ್ ಕೊಡಿ","Bill kodi","Bill please"]
  ],
  "Health": [
    ["ನನಗೆ ಹುಷಾರಿಲ್ಲ","Nanage hushaarilla","I am not well"],
    ["ತಲೆ ನೋವು","Tale novu","Headache"],
    ["ಔಷಧಿ ಅಂಗಡಿ ಎಲ್ಲಿದೆ?","Aushadhi angadi ellide?","Where is the pharmacy?"],
    ["ವೈದ್ಯರು ಎಲ್ಲಿ?","Vaidyaru elli?","Where is the doctor?"],
    ["ಸಹಾಯ ಮಾಡಿ","Sahaaya maadi","Please help"]
  ],
  "Work & school": [
    ["ನನಗೆ ಸ್ವಲ್ಪ ಸ್ವಲ್ಪ ಕನ್ನಡ ಬರುತ್ತದೆ","Nanage svalpa svalpa Kannada baruttade","I know a little Kannada"],
    ["ದಯವಿಟ್ಟು ನಿಧಾನವಾಗಿ ಮಾತನಾಡಿ","Dayavittu nidhaanavaagi maatanaadi","Please speak slowly"],
    ["ಮತ್ತೊಮ್ಮೆ ಹೇಳಿ","Mattomme heli","Please say it again"],
    ["ನನಗೆ ಅರ್ಥವಾಗಲಿಲ್ಲ","Nanage arthavaagalilla","I did not understand"],
    ["ಸಭೆ ಯಾವಾಗ?","Sabhe yaavaaga?","When is the meeting?"]
  ]
};
const ALL = Object.values(DATA).flat();

/* ============ 2. SMALL HELPERS ============ */
const $ = s => document.querySelector(s);
let done = JSON.parse(localStorage.getItem("kfe-done") || "{}");   // remembers phrases you practised well
const save = () => localStorage.setItem("kfe-done", JSON.stringify(done));

/* ============ 3. TEXT-TO-SPEECH: listen to the phrase ============ */
function speak(text){
  if(!("speechSynthesis" in window)) return alert("Speech is not supported in this browser. Try Chrome or Edge.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "kn-IN"; u.rate = 0.85;
  const v = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith("kn"));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function checkVoice(){
  const has = speechSynthesis.getVoices().some(v => v.lang.toLowerCase().startsWith("kn"));
  const n = $("#notice");
  n.hidden = has;
  if(!has) n.textContent = "No Kannada voice found on this device, so the Listen button may stay silent. On Android Chrome it works out of the box. On Windows, add Kannada under Settings > Time & language > Speech > Add voices.";
}
if("speechSynthesis" in window){ speechSynthesis.onvoiceschanged = checkVoice; checkVoice(); }

/* ============ 4. SPEECH-TO-TEXT + SCORING: say the phrase, get a similarity score ============ */
// Levenshtein distance = number of single-character edits between two strings
function lev(a,b){
  const d = Array.from({length:a.length+1},(_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=1;j<=b.length;j++) d[0][j]=j;
  for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length];
}
const clean = s => s.replace(/[?.,!]/g,"").replace(/\s+/g,"").toLowerCase();
function score(heard, target){
  const a=clean(heard), b=clean(target);
  return Math.max(0, Math.round((1 - lev(a,b)/Math.max(a.length,b.length,1))*100));
}
function practise(i, out){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ out.textContent = "Voice practice needs Chrome or Edge."; out.className="res bad"; return; }
  const r = new SR(); r.lang = "kn-IN"; r.maxAlternatives = 1;
  out.className = "res"; out.textContent = "Listening… say the phrase now.";
  r.onresult = e => {
    const heard = e.results[0][0].transcript, s = score(heard, ALL[i][0]);
    out.className = "res " + (s>=70 ? "good" : "bad");
    out.textContent = `I heard: "${heard}" · Match ${s}% ` + (s>=70 ? "– well done!" : "– listen again and retry.");
    if(s>=70){ done[ALL[i][0]] = 1; save(); updateProgress(); }
  };
  r.onerror = e => { out.className="res bad"; out.textContent = "Could not hear you (" + e.error + "). Allow the microphone and try again."; };
  r.start();
}

/* ============ 5. LEARN TAB ============ */
let cat = Object.keys(DATA)[0];
function updateProgress(){ const p=$("#prog"); if(p){ const n=Object.keys(done).length; $("#pt").textContent=`${n} of ${ALL.length} phrases practised`; p.style.width=(n/ALL.length*100)+"%"; } }
function renderLearn(){
  const box = $("#learn");
  box.innerHTML = `<div class="chips" role="group" aria-label="Situations">` +
    Object.keys(DATA).map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("") +
    `</div><div id="pt" class="en"></div><div class="bar"><i id="prog"></i></div><div id="list"></div>`;
  box.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderLearn();});
  const list = $("#list");
  DATA[cat].forEach(p=>{
    const i = ALL.indexOf(p), el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div><div class="kn">${p[0]}${done[p[0]]?" ✓":""}</div><div class="tr">${p[1]}</div><div class="en">${p[2]}</div></div>
      <div class="acts"><button class="btn">Listen</button><button class="btn alt">Say it</button></div><div class="res" aria-live="polite"></div>`;
    const [l,s] = el.querySelectorAll("button"), out = el.querySelector(".res");
    l.onclick = () => speak(p[0]);
    s.onclick = () => practise(i, out);
    list.appendChild(el);
  });
  updateProgress();
}

/* ============ 6. QUIZ TAB: pick the right Kannada phrase for an English meaning ============ */
let qn = 0, qs = 0, cur;
function renderQuiz(){
  const box = $("#quiz");
  if(qn >= 8){
    box.innerHTML = `<div class="card"><div><div class="q">Quiz complete: ${qs} / 8</div><div class="en">${qs>=6?"Excellent. You are ready to try these out loud.":"Revisit the Learn tab, then try again."}</div></div><button class="btn" id="again">Play again</button></div>`;
    $("#again").onclick = () => { qn=0; qs=0; renderQuiz(); };
    return;
  }
  cur = ALL[Math.floor(Math.random()*ALL.length)];
  const opts = [cur];
  while(opts.length<4){ const o = ALL[Math.floor(Math.random()*ALL.length)]; if(!opts.includes(o)) opts.push(o); }
  opts.sort(()=>Math.random()-.5);
  box.innerHTML = `<div class="en">Question ${qn+1} of 8 · Score ${qs}</div><div class="q">How do you say: “${cur[2]}”?</div><div id="opts"></div>`;
  opts.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt"; b.innerHTML = `<span class="kn" style="font-size:1.2rem">${o[0]}</span><br><span class="tr">${o[1]}</span>`;
    b.onclick = () => {
      document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      if(o===cur){ b.classList.add("right"); qs++; } else { b.classList.add("wrong"); }
      speak(cur[0]); qn++; setTimeout(renderQuiz, 1400);
    };
    $("#opts").appendChild(b);
  });
}

/* ============ 7. TABS ============ */
function show(tab){
  $("#learn").hidden = tab!=="learn"; $("#quiz").hidden = tab!=="quiz";
  $("#t-learn").setAttribute("aria-selected", tab==="learn"); $("#t-quiz").setAttribute("aria-selected", tab==="quiz");
  if(tab==="quiz"){ qn=0; qs=0; renderQuiz(); }
}
$("#t-learn").onclick = () => show("learn");
$("#t-quiz").onclick = () => show("quiz");
renderLearn();
</script>
</body>
</html>
